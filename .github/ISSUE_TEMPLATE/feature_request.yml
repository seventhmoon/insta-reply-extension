name: 💡 Feature Request
description: Propose a new feature, adapter, provider, or UX improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make InstaReply AI even better? Tell us about it!

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - New Social Media Platform Adapter
        - New AI Provider / Model Integration
        - Tone & Stance Presets
        - UI & Extension Experience
        - Performance & Caching
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the limitation or workflow hurdle you encountered.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you considered.

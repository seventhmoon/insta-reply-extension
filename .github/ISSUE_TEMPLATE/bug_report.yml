name: 🐛 Bug Report
description: Report unexpected behavior, broken DOM injection, or API errors
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check if your issue has already been reported.

  - type: dropdown
    id: platform
    attributes:
      label: Social Media Platform
      description: Where did the bug occur?
      options:
        - Instagram (Feed / Comments / Reels)
        - Instagram (Stories)
        - Instagram (Direct Messages / PIP)
        - Meta Threads
        - X (Twitter)
        - LinkedIn (Feed / Comments / InMail)
        - Facebook
        - Meta Business Suite
        - Extension Popup / Settings
        - Other
    validations:
      required: true

  - type: dropdown
    id: ai-provider
    attributes:
      label: AI Provider
      description: Which provider were you using when the issue happened?
      options:
        - Google Gemini API
        - Groq Cloud
        - OpenRouter
        - Custom OpenAI-Compatible Endpoint
        - Local LLM (Ollama / LM Studio)
        - Chrome Built-in Prompt API (Gemini Nano)
        - N/A
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension Version
      description: E.g., v1.4.2 (check chrome://extensions)
      placeholder: "1.4.2"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: E.g., Chrome 130 on macOS / Brave on Windows 11
      placeholder: "Chrome 130 on macOS Sequoia"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open Instagram post '...'
        2. Click '✨ AI Reply' on comment
        3. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: console-logs
    attributes:
      label: Console Logs / Error Messages
      description: Paste any error messages from the browser DevTools Console (F12) or Extension Service Worker.
      render: shell
